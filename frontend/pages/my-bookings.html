
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Bookings - EventSphere</title>
    <link rel="stylesheet" href="/style.css?v=12">
    <link rel="stylesheet" href="/css/responsive.css?v=12">

    <style>
        .booking-page { width: 90%; max-width: 900px; margin: 40px auto; }
        .booking-card {
            background: white;
            padding: 25px;
            margin: 20px 0;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,.08);
            border-left: 5px solid #2563eb;
            overflow-wrap: anywhere;
        }
        .booking-card h3 { color: #172554; margin-bottom: 12px; }
        .booking-card p { margin: 8px 0; }
        .cancel-button { background: #dc2626; margin-top: 12px; }
        .cancel-button:hover { background: #b91c1c; }
    </style>
</head>

<body>
<header>
    <div class="logo">EventSphere</div>
    <nav>
        <a href="../index.html">Home</a>
        <a href="./events.html">Events</a>
        <a href="./my-tickets.html">My Tickets</a>
        <a href="./login.html">Login</a>
    </nav>
</header>

<main class="booking-page">
    <h1>My Bookings</h1>
    <div id="bookingList">Loading bookings...</div>
</main>

<footer>
    <p>&copy; 2026 EventSphere. All Rights Reserved.</p>
</footer>

<script>
const API = window.location.origin;

async function loadBookings() {
    const container = document.getElementById("bookingList");

    try {
        const response = await fetch(`${API}/bookings/my-bookings`, {
            credentials: "include"
        });

        const result = await response.json();

        if (!response.ok) {
            container.textContent = result.detail || "Please login to view your bookings.";
            return;
        }

        if (!Array.isArray(result) || result.length === 0) {
            container.textContent = "No bookings found.";
            return;
        }

        container.innerHTML = "";

        result.forEach(booking => {
            const card = document.createElement("div");
            card.className = "booking-card";

            const heading = document.createElement("h3");
            heading.textContent = booking.event || "Event";

            const info = document.createElement("p");
            info.textContent =
                `Booking ID: ${booking.booking_id} | Quantity: ${booking.quantity} | Total: Rs. ${booking.total_amount} | Status: ${booking.status}`;

            const payment = document.createElement("p");
            payment.textContent =
                `Payment Reference: ${booking.payment_reference || "N/A"}`;

            card.append(heading, info, payment);

            if (booking.status === "confirmed") {
                const button = document.createElement("button");
                button.className = "cancel-button";
                button.textContent = "Cancel Booking";
                button.onclick = () => cancelBooking(booking.booking_id);
                card.appendChild(button);
            }

            container.appendChild(card);
        });

    } catch (error) {
        container.textContent = "Cannot connect to backend.";
        console.error(error);
    }
}

async function cancelBooking(id) {
    if (!confirm("Are you sure you want to cancel this booking?")) return;

    try {
        const response = await fetch(`${API}/bookings/${id}/cancel`, {
            method: "PUT",
            credentials: "include",
            headers: {
                "X-CSRF-Token": sessionStorage.getItem("csrf_token") || ""
            }
        });

        const result = await response.json();

        if (!response.ok) {
            alert(result.detail || "Cancellation failed.");
            return;
        }

        alert(result.message || "Booking cancellation completed.");
        await loadBookings();

    } catch (error) {
        alert("Unable to connect to backend.");
        console.error(error);
    }
}

loadBookings();
</script>
</body>
</html>
