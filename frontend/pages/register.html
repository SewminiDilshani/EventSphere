
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - EventSphere</title>
    <link rel="stylesheet" href="/style.css?v=12">
    <link rel="stylesheet" href="/css/responsive.css?v=12">

    <style>
        .auth-container {
            width: 90%;
            max-width: 480px;
            margin: 55px auto;
            padding: 35px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0,0,0,.08);
        }

        .auth-container h1 { text-align: center; color: #172554; margin-bottom: 25px; }
        .auth-container form { margin: 0; padding: 0; box-shadow: none; max-width: none; }
        .auth-container button { width: 100%; margin-top: 15px; }
        .auth-container > p { text-align: center; margin-top: 20px; }
        #message { text-align: center; margin-top: 15px; font-weight: bold; }

        @media(max-width:500px) {
            .auth-container { padding: 22px; margin: 30px auto; }
        }
    </style>
</head>

<body>
<header>
    <div class="logo">EventSphere</div>
    <nav>
        <a href="../index.html">Home</a>
        <a href="./events.html">Events</a>
        <a href="./login.html">Login</a>
    </nav>
</header>

<main class="auth-container">
    <h1>Create Account</h1>

    <form id="registerForm">
        <label for="name">Full Name</label>
        <input type="text" id="name" placeholder="Enter your full name"
               minlength="2" maxlength="100" required>

        <label for="email">Email</label>
        <input type="email" id="email" placeholder="Enter your email"
               maxlength="150" required>

        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Minimum 8 characters"
               minlength="8" maxlength="128" required>

        <button type="submit" id="registerButton">Create Account</button>
        <p id="message" role="status" aria-live="polite"></p>
    </form>

    <p>Already registered? <a href="./login.html">Login here</a></p>
</main>

<footer>
    <p>&copy; 2026 EventSphere. All Rights Reserved.</p>
</footer>

<script>
const API = window.location.origin;

document.getElementById("registerForm").addEventListener("submit", async function(event) {
    event.preventDefault();

    const message = document.getElementById("message");
    const button = document.getElementById("registerButton");

    const data = {
        name: document.getElementById("name").value.trim(),
        email: document.getElementById("email").value.trim(),
        password: document.getElementById("password").value
    };

    if (data.name.length < 2) {
        message.style.color = "red";
        message.textContent = "Name must contain at least 2 characters.";
        return;
    }

    if (data.password.length < 8) {
        message.style.color = "red";
        message.textContent = "Password must contain at least 8 characters.";
        return;
    }

    button.disabled = true;
    message.style.color = "#333";
    message.textContent = "Creating account...";

    try {
        const response = await fetch(`${API}/auth/register`, {
            method: "POST",
            credentials: "include",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(data)
        });

        const result = await response.json();

        if (!response.ok) {
            let errorMessage = "Registration failed.";

            if (typeof result.detail === "string") {
                errorMessage = result.detail;
            } else if (Array.isArray(result.detail)) {
                errorMessage = result.detail.map(error => error.msg).join(", ");
            }

            throw new Error(errorMessage);
        }

        message.style.color = "green";
        message.textContent = "Account created successfully! Please login.";
        this.reset();

    } catch (error) {
        message.style.color = "red";
        message.textContent = error.message;
        console.error(error);
    } finally {
        button.disabled = false;
    }
});
</script>
</body>
</html>
