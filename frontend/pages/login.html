
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - EventSphere</title>
    <link rel="stylesheet" href="/style.css?v=15">
    <link rel="stylesheet" href="/css/responsive.css?v=15">
    
    <style>
        .auth-container {
            width: 90%;
            max-width: 460px;
            margin: 60px auto;
            padding: 35px;
            background: white;
            border-radius: 12px;
            box-shadow: var(--shadow);
        }

        .auth-container h1 {
            text-align: center;
            color: var(--ink);
            margin-bottom: 25px;
        }

        .auth-container form {
            max-width: none;
            margin: 0;
            padding: 0;
            box-shadow: none;
        }

        .auth-container input {
            width: 100%;
            box-sizing: border-box;
            margin-bottom: 15px;
        }

        .auth-container button { width: 100%; margin-top: 15px; }
        .auth-container > p { text-align: center; margin-top: 20px; }
        #message { text-align: center; margin-top: 15px; font-weight: bold; }

        @media(max-width:500px) {
            .auth-container { padding: 22px; margin: 35px auto; }
        }
    </style>
</head>

<body>
<header>
    <div class="logo">EventSphere</div>
    <nav>
        <a href="../index.html">Home</a>
        <a href="./events.html">Events</a>
        <a href="./register.html">Register</a>
    </nav>
</header>

<main class="auth-container">
    <h1>Login to EventSphere</h1>

    <form id="loginForm">
        <label for="email">Email</label>
        <input type="email" id="email" required placeholder="Enter your email">

        <label for="password">Password</label>
        <div class="password-input-wrapper">
            <input type="password" id="password" required
                   placeholder="Enter your password" autocomplete="current-password">
            <button type="button" class="password-toggle" aria-label="Show password"
                    aria-controls="password" aria-pressed="false" title="Show password">
                <svg class="icon-show" viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7Z"></path>
                    <circle cx="12" cy="12" r="3"></circle>
                </svg>
                <svg class="icon-hide" viewBox="0 0 24 24" aria-hidden="true">
                    <path d="m3 3 18 18"></path>
                    <path d="M10.6 10.6a2 2 0 0 0 2.8 2.8"></path>
                    <path d="M9.9 5.2A10.7 10.7 0 0 1 12 5c6.4 0 10 7 10 7a15.7 15.7 0 0 1-3.1 3.9"></path>
                    <path d="M6.2 6.2C3.5 8 2 12 2 12s3.6 7 10 7a10.7 10.7 0 0 0 4-.8"></path>
                </svg>
            </button>
        </div>

        <button type="submit" id="loginButton">Login</button>
        <p id="message" role="status" aria-live="polite"></p>
    </form>

    <p>Don't have an account? <a href="./register.html">Register here</a></p>
</main>

<footer>
    <p>&copy; 2026 EventSphere. All Rights Reserved.</p>
</footer>

<script>
document.querySelectorAll(".password-toggle").forEach(button => {
    const password = document.getElementById(button.getAttribute("aria-controls"));

    button.addEventListener("click", () => {
        const isVisible = password.type === "password";
        password.type = isVisible ? "text" : "password";
        button.setAttribute("aria-pressed", String(isVisible));
        button.setAttribute("aria-label", isVisible ? "Hide password" : "Show password");
        button.title = isVisible ? "Hide password" : "Show password";
    });
});

const API = window.location.origin;

document.getElementById("loginForm").addEventListener("submit", async function(event) {
    event.preventDefault();

    const message = document.getElementById("message");
    const button = document.getElementById("loginButton");

    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;

    button.disabled = true;
    message.style.color = "var(--ink-soft)";
    message.textContent = "Logging in...";

    try {
        const response = await fetch(`${API}/auth/login`, {
            method: "POST",
            credentials: "include",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({ email, password })
        });

        const result = await response.json();

        if (!response.ok) {
            throw new Error(result.detail || "Invalid email or password.");
        }

        if (!result.csrf_token) {
            throw new Error("CSRF token was not received from the server.");
        }

        sessionStorage.setItem("csrf_token", result.csrf_token);
        if (!["admin", "staff", "attendee"].includes(result.role)) {
            throw new Error(
                "Login succeeded, but the account has an invalid role. Contact an administrator."
            );
        }

        message.style.color = "var(--success)";
        message.textContent = "Login successful!";

        setTimeout(() => {
            if (result.role === "admin") {
                window.location.href = "./admin-dashboard.html";
            } else if (result.role === "staff") {
                window.location.href = "./staff-dashboard.html";
            } else {
                window.location.href = "./events.html";
            }
        }, 400);

    } catch (error) {
        message.style.color = "var(--danger)";
        message.textContent = error.message;
        console.error("Login error:", error);
    } finally {
        button.disabled = false;
    }
});
</script>
</body>
</html>
