
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Events - EventSphere</title>
    <link rel="stylesheet" href="/style.css?v=15">
    <link rel="stylesheet" href="/css/responsive.css?v=15">

    <style>
        .events-section {
            width: min(1200px, 92%);
            margin: 0 auto;
            padding: 56px 0 72px;
            min-height: 75vh;
        }

        .events-heading {
            text-align: center;
            margin-bottom: 36px;
        }

        .events-heading h1 {
            margin: 0 0 10px;
        }

        .events-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(min(100%, 290px), 1fr));
            gap: 22px;
        }

        .event-card {
            display: flex;
            flex-direction: column;
            min-width: 0;
            overflow: hidden;
            border: 1px solid var(--line);
            border-radius: var(--radius);
            background: var(--surface);
            box-shadow: var(--shadow);
            transition: transform 180ms ease, box-shadow 180ms ease;
        }

        .event-card:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-hover);
        }

        .event-card-image,
        .event-card-placeholder {
            width: 100%;
            aspect-ratio: 16 / 9;
            object-fit: cover;
            background: linear-gradient(135deg, var(--ink), var(--brand) 62%, var(--accent));
        }

        .event-card-placeholder {
            display: grid;
            place-items: center;
            color: #fff;
            font-size: 1.15rem;
            font-weight: 750;
            letter-spacing: .04em;
        }

        .event-card-body {
            display: flex;
            flex: 1;
            flex-direction: column;
            padding: 20px;
            overflow-wrap: anywhere;
        }

        .event-card h2 {
            margin: 0 0 9px;
            font-size: 1.18rem;
        }

        .event-category {
            align-self: flex-start;
            margin: 0 0 12px;
            padding: 3px 10px;
            border-radius: 999px;
            background: var(--brand-pale);
            color: var(--brand-dark);
            font-size: .78rem;
            font-weight: 700;
        }

        .event-description {
            display: -webkit-box;
            overflow: hidden;
            margin: 0 0 15px;
            color: var(--ink-soft);
            -webkit-box-orient: vertical;
            -webkit-line-clamp: 3;
        }

        .event-meta {
            display: grid;
            gap: 7px;
            margin: 0 0 18px;
            color: var(--ink-soft);
            font-size: .9rem;
        }

        .event-meta strong { color: var(--ink); }

        .event-card .event-button {
            width: 100%;
            margin-top: auto;
        }

        .loading-message {
            text-align: center;
            color: var(--muted);
            grid-column: 1 / -1;
        }

        @media(max-width:600px) {
            .events-section { width: 92%; padding: 36px 0 48px; }
        }
    </style>
</head>

<body>

<header>
    <div class="logo">EventSphere</div>
    <nav>
        <a href="../index.html">Home</a>
        <a href="./events.html">Events</a>
        <a href="./venue-hire.html">Venue Hire</a>
        <a href="./login.html">Login</a>
        <a href="./register.html">Register</a>
    </nav>
</header>

<main class="events-section">

    <div class="events-heading">
        <h1>Explore Events</h1>
        <p>Discover exciting events and book your tickets.</p>
    </div>

    <div class="events-grid" id="eventsContainer">
        <p class="loading-message">Loading events...</p>
    </div>

</main>

<footer>
    <p>&copy; 2026 EventSphere. All Rights Reserved.</p>
</footer>

<script src="/auth.js"></script>
<script>
const API_URL = window.location.origin;
const EVENT_TIME_ZONE = "Asia/Colombo";

async function loadRoleDashboardLink() {
    const navigation = document.querySelector("header nav");

    try {
        const response = await fetch(`${API_URL}/auth/me`, {
            credentials: "include"
        });
        if (response.status === 401) {
            return;
        }

        const user = await response.json();
        if (!response.ok) {
            throw new Error(user.detail || "Unable to load account details.");
        }

        const dashboard = {
            admin: {
                href: "./admin-dashboard.html",
                label: "Admin Dashboard"
            },
            staff: {
                href: "./staff-dashboard.html",
                label: "Staff Dashboard"
            }
        }[user.role];

        if (!dashboard) {
            return;
        }

        navigation.querySelectorAll('a[href="./login.html"], a[href="./register.html"]')
            .forEach(link => link.remove());

        const dashboardLink = document.createElement("a");
        dashboardLink.href = dashboard.href;
        dashboardLink.textContent = dashboard.label;

        const logoutButton = document.createElement("button");
        logoutButton.type = "button";
        logoutButton.textContent = "Logout";
        logoutButton.addEventListener("click", logout);

        navigation.append(dashboardLink, logoutButton);
    } catch (error) {
        console.error("Account navigation error:", error);
    }
}

function parseEventTime(value) {
    return new Date(/[zZ]|[+-]\d{2}:\d{2}$/.test(value) ? value : `${value}+05:30`);
}

function formatEventTime(value, options) {
    return new Intl.DateTimeFormat("en-LK", {
        ...options,
        timeZone: EVENT_TIME_ZONE
    }).format(parseEventTime(value));
}

async function loadEvents() {
    const container = document.getElementById("eventsContainer");

    try {
        const response = await fetch(`${API_URL}/events/published`);
        const events = await response.json();

        if (!response.ok) {
            throw new Error(events.detail || "Failed to load events.");
        }

        container.innerHTML = "";

        if (!Array.isArray(events) || events.length === 0) {
            container.innerHTML =
                "<p class='loading-message'>No published events available.</p>";
            return;
        }

        events.forEach(event => {
            const card = document.createElement("article");
            card.className = "event-card";

            if (event.cover_image_url) {
                const image = document.createElement("img");
                image.className = "event-card-image";
                image.src = event.cover_image_url;
                image.alt = `Cover image for ${event.title}`;
                image.loading = "lazy";
                image.onerror = () => {
                    const fallback = document.createElement("div");
                    fallback.className = "event-card-placeholder";
                    fallback.textContent = "EventSphere";
                    image.replaceWith(fallback);
                };
                card.appendChild(image);
            } else {
                const fallback = document.createElement("div");
                fallback.className = "event-card-placeholder";
                fallback.textContent = "EventSphere";
                card.appendChild(fallback);
            }

            const body = document.createElement("div");
            body.className = "event-card-body";

            const title = document.createElement("h2");
            title.textContent = event.title;

            const category = document.createElement("p");
            category.className = "event-category";
            category.textContent = event.category || "Event";

            const description = document.createElement("p");
            description.className = "event-description";
            description.textContent = event.description || "More event details coming soon.";

            const meta = document.createElement("div");
            meta.className = "event-meta";
            const date = document.createElement("div");
            date.innerHTML = "<strong>Date:</strong> ";
            date.append(
                document.createTextNode(formatEventTime(event.start_time, {
                    day: "2-digit",
                    month: "long",
                    year: "numeric"
                }))
            );

            const time = document.createElement("div");
            time.innerHTML = "<strong>Time:</strong> ";
            time.append(
                document.createTextNode(
                    `${formatEventTime(event.start_time, {
                    hour: "2-digit",
                    minute: "2-digit"
                    })} – ${formatEventTime(event.end_time, {
                        hour: "2-digit",
                        minute: "2-digit"
                    })}`
                )
            );

            const venue = document.createElement("div");
            venue.innerHTML = "<strong>Venue:</strong> ";
            venue.append(
                document.createTextNode(
                    [event.venue_name, event.venue_location].filter(Boolean).join(" · ")
                    || "Venue details to be announced"
                )
            );

            const price = document.createElement("div");
            price.innerHTML = "<strong>Tickets from:</strong> ";
            price.append(
                document.createTextNode(
                    event.starting_price == null
                        ? "Price to be announced"
                        : `Rs. ${Number(event.starting_price).toLocaleString("en-LK")}`
                )
            );
            meta.append(date, time, venue, price);

            const link = document.createElement("a");
            link.className = "event-button";
            link.href = `./event-details.html?id=${encodeURIComponent(event.id)}`;
            link.textContent = "View Details";

            body.append(title, category, description, meta, link);
            card.appendChild(body);
            container.appendChild(card);
        });

    } catch (error) {
        container.innerHTML = "";
        const errorMessage = document.createElement("p");
        errorMessage.className = "loading-message";
        errorMessage.textContent = error.message;
        container.appendChild(errorMessage);
        console.error("Event loading error:", error);
    }
}

loadRoleDashboardLink();
loadEvents();
</script>

</body>
</html>
