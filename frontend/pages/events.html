
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Events - EventSphere</title>
    <link rel="stylesheet" href="/style.css?v=12">
    <link rel="stylesheet" href="/css/responsive.css?v=12">

    <style>
        .events-section {
            padding: 45px 7%;
            min-height: 75vh;
        }

        .events-heading {
            text-align: center;
            margin-bottom: 35px;
        }

        .events-heading h1 {
            color: #172554;
            font-size: 34px;
            margin-bottom: 12px;
        }

        .events-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 24px;
        }

        .event-card {
            background: white;
            padding: 24px;
            border-radius: 10px;
            box-shadow: 0 3px 12px rgba(0,0,0,.08);
            overflow-wrap: anywhere;
        }

        .event-card h3 { color: #1d4ed8; margin-bottom: 14px; }
        .event-card p { margin-bottom: 11px; line-height: 1.5; }

        .event-button {
            display: inline-block;
            margin-top: 10px;
            padding: 11px 20px;
            background: #2563eb;
            color: white;
            text-decoration: none;
            border-radius: 6px;
        }

        .loading-message {
            text-align: center;
            color: #555;
            grid-column: 1 / -1;
        }

        @media(max-width:600px) {
            .events-section { padding: 30px 4%; }
            .events-heading h1 { font-size: 28px; }
        }
    </style>
</head>

<body>

<header>
    <div class="logo">EventSphere</div>
    <nav>
        <a href="../index.html">Home</a>
        <a href="./events.html">Events</a>
        <a href="./venue-hire.html">Venue Hire</a>
        <a href="./login.html">Login</a>
        <a href="./register.html">Register</a>
    </nav>
</header>

<main class="events-section">

    <div class="events-heading">
        <h1>Explore Events</h1>
        <p>Discover exciting events and book your tickets.</p>
    </div>

    <div class="events-grid" id="eventsContainer">
        <p class="loading-message">Loading events...</p>
    </div>

</main>

<footer>
    <p>&copy; 2026 EventSphere. All Rights Reserved.</p>
</footer>

<script>
const API_URL = window.location.origin;

async function loadEvents() {
    const container = document.getElementById("eventsContainer");

    try {
        const response = await fetch(`${API_URL}/events/published`);
        const events = await response.json();

        if (!response.ok) {
            throw new Error(events.detail || "Failed to load events.");
        }

        container.innerHTML = "";

        if (!Array.isArray(events) || events.length === 0) {
            container.innerHTML =
                "<p class='loading-message'>No published events available.</p>";
            return;
        }

        events.forEach(event => {
            const card = document.createElement("article");
            card.className = "event-card";

            const title = document.createElement("h3");
            title.textContent = event.title;

            const category = document.createElement("p");
            category.textContent = `Category: ${event.category || "N/A"}`;

            const venue = document.createElement("p");
            venue.textContent = `Venue ID: ${event.venue_id}`;

            const date = document.createElement("p");
            date.textContent =
                `Date: ${new Date(event.start_time).toLocaleDateString("en-GB", {
                    day: "2-digit",
                    month: "long",
                    year: "numeric"
                })}`;

            const time = document.createElement("p");
            time.textContent =
                `Time: ${new Date(event.start_time).toLocaleTimeString("en-GB", {
                    hour: "2-digit",
                    minute: "2-digit"
                })}`;

            const description = document.createElement("p");
            description.textContent = event.description || "No description available.";

            const link = document.createElement("a");
            link.className = "event-button";
            link.href = `./event-details.html?id=${encodeURIComponent(event.id)}`;
            link.textContent = "View Details";

            card.append(title, category, venue, date, time, description, link);
            container.appendChild(card);
        });

    } catch (error) {
        container.innerHTML = "";
        const errorMessage = document.createElement("p");
        errorMessage.className = "loading-message";
        errorMessage.textContent = error.message;
        container.appendChild(errorMessage);
        console.error("Event loading error:", error);
    }
}

loadEvents();
</script>

</body>
</html>
